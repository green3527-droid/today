<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kakao Daily Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<body>
    <div class="mobile-container">
        <!-- 헤더 영역 -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="logo">mjin</h1>
                <span id="sync-status" style="font-size:11px; color:#999; margin-left:6px;">연결 중...</span>
            </div>
            <div class="header-right">
                <button onclick="showReport()" class="btn-report">📊 리포트</button>
                <button id="theme-toggle" class="btn-theme">🌙</button>
            </div>
        </header>

        <!-- 주간 달력 스트립 (일~토) -->
        <div id="day-strip" class="day-strip"></div>

        <!-- 네비게이션 (날짜 선택 및 오늘 버튼) -->
        <nav class="week-nav">
            <button onclick="moveDay(-1)" class="nav-arrow arrow-prev"></button>
            <div class="nav-center">
                <span id="current-focus-date" class="view-date-text"></span>
                <button onclick="setToday()" class="btn-today-mini">오늘</button>
            </div>
            <button onclick="moveDay(1)" class="nav-arrow arrow-next"></button>
        </nav>

        <!-- 오늘의 한마디 (상속형 메모) -->
        <section class="daily-msg-section" onclick="editDailyMsg()">
            <div class="msg-box"><span class="msg-icon">💬</span>
                <p id="daily-msg-text">한마디를 입력해주세요.</p>
            </div>
        </section>

        <!-- 일일 요약 지표 -->
        <section class="day-summary">
            <div class="sum-box"><span class="label">이 날의 지출</span><span class="val" id="day-expense">0</span></div>
            <div class="sum-box"><span class="label">남은 할일</span><span class="val" id="day-todo-count">0</span></div>
        </section>

        <!-- 메인 탭 메뉴 -->
        <div class="main-tabs">
            <button class="m-tab active" onclick="switchTab('acc')">💰 가계부</button>
            <button class="m-tab" onclick="switchTab('todo')">✅ 할 일</button>
        </div>

        <main class="content">
            <!-- 가계부 입력 (2줄 구조) -->
            <div id="section-acc" class="tab-content active">
                <div class="input-form">
                    <div class="row">
                        <select id="acc-cat" class="kakao-input cat-select" style="flex:0.4">
                            <option value="식비">🍔 식비</option>
                            <option value="교통비">🚌 교통비</option>
                            <option value="문화비">🎬 문화비</option>
                            <option value="쇼핑">🛍️ 쇼핑</option>
                            <option value="기타">✨ 기타</option>
                        </select>
                        <input type="number" id="acc-amount" class="kakao-input" placeholder="금액" style="flex:0.6; width: 100%;">
                    </div>
                    <div class="row"><input type="text" id="acc-desc" class="kakao-input" placeholder="상세 내역을 입력하세요"
                            style="flex:1"></div>
                    <div class="row-sub">
                        <div class="fixed-options">
                            <label class="check-label"><input type="checkbox" id="acc-fixed"> 고정지출</label>
                            <select id="acc-fixed-period" class="kakao-input cat-select">
                                <option value="every">매일</option>
                                <option value="weekday">월~금</option>
                            </select>
                        </div>
                        <button onclick="addDailyEntry()" class="btn-add">등록</button>
                    </div>
                </div>
                <ul id="acc-list" class="kakao-list"></ul>
            </div>

            <!-- 할 일 입력 -->
            <div id="section-todo" class="tab-content">
                <div class="input-form">
                    <div class="row">
                        <input type="time" id="todo-time" class="kakao-input" style="flex:0.3" value="08:00">
                        <input type="text" id="todo-input" class="kakao-input" placeholder="할 일 입력" style="flex:0.7; width: 100%;">
                    </div>
                    <div class="row-sub">
                        <div class="fixed-options">
                            <label class="check-label"><input type="checkbox" id="todo-repeat"> 모든 날짜 반복일정</label>
                            <select id="todo-repeat-period" class="kakao-input cat-select">
                                <option value="every">매일</option>
                                <option value="weekday">월~금</option>
                            </select>
                        </div>
                        <button onclick="addDailyTodo()" class="btn-add">등록</button>
                    </div>
                </div>
                <ul id="todo-list" class="kakao-list"></ul>
            </div>
        </main>
    </div>

    <!-- 리포트 모달 -->
    <div id="report-modal" class="modal">
        <div class="modal-content">
            <h3>소비 리포트</h3>
            <div id="report-weekly-body"></div>
            <div class="report-month-box" id="report-monthly-body"></div><button onclick="closeModal()"
                class="btn-close">닫기</button>
        </div>
    </div>

    <script>
        const toDateKey = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        // ===== Firebase 설정 =====
        // 아래 firebaseConfig 값을 본인의 Firebase 프로젝트 설정값으로 교체하세요.
        // (Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정 및 구성 에서 확인)
        const firebaseConfig = {
            apiKey: "AIzaSyCRUUURJjH1r5YPe4lZdmZgWDehALSn43I",
            authDomain: "mjin-today.firebaseapp.com",
            databaseURL: "https://mjin-today-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mjin-today",
            storageBucket: "mjin-today.firebasestorage.app",
            messagingSenderId: "739442717844",
            appId: "1:739442717844:web:86c5339f16f4e198d43081"
        };
        // 데이터가 저장될 위치(경로). 다른 사람과 겹치지 않도록 임의의 문자열로 바꿔도 됩니다.
        const SYNC_PATH = "mjin_daily_data";

        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref(SYNC_PATH);

        let db = {};
        let fixedAcc = [];
        let fixedTodo = [];
        const realToday = toDateKey(new Date());
        let selectedDate = realToday;
        let isSaving = false; // 내가 방금 저장한 변경사항이 되돌아와서 다시 렌더링되는 것 방지용

        const syncStatusEl = () => document.getElementById('sync-status');

        // Firebase 실시간 리스너: PC/모바일 어느 쪽에서 바뀌든 즉시 반영됨
        dbRef.on('value', (snapshot) => {
            if (isSaving) { isSaving = false; return; }
            const data = snapshot.val();
            if (data) {
                db = data.db || {};
                fixedAcc = data.fixedAcc || [];
                fixedTodo = data.fixedTodo || [];
            }
            if (syncStatusEl()) syncStatusEl().innerText = '✅ 동기화됨';
            render();
        }, (error) => {
            console.error(error);
            if (syncStatusEl()) syncStatusEl().innerText = '⚠️ 연결 실패';
        });

        function save() {
            isSaving = true;
            dbRef.set({ db, fixedAcc, fixedTodo }).catch((err) => {
                console.error(err);
                if (syncStatusEl()) syncStatusEl().innerText = '⚠️ 저장 실패';
            });
        }

        function getEffectiveMsg(dateStr) {
            if (db[dateStr] && db[dateStr].msg) return db[dateStr].msg;
            const pastDates = Object.keys(db).filter(d => d < dateStr && db[d].msg).sort().reverse();
            return pastDates.length > 0 ? db[pastDates[0]].msg : "오늘의 한마디를 입력해보세요.";
        }

        function render() {
            if (!db[selectedDate]) db[selectedDate] = { acc: [], todo: [], done: [], msg: "" };
            document.getElementById('current-focus-date').innerText = selectedDate.replace(/-/g, '.');
            document.getElementById('daily-msg-text').innerText = getEffectiveMsg(selectedDate);
            renderDayStrip();

            const dayOfWeek = new Date(selectedDate).getDay();
            const isWeekday = dayOfWeek >= 1 && dayOfWeek <= 5;

            // 1. 가계부 렌더링
            const accList = document.getElementById('acc-list'); accList.innerHTML = '';
            let dayTotal = 0;
            const activeFixedAcc = fixedAcc.filter(item => {
                if (item.fixedPeriod === 'weekday') return isWeekday;
                return true;
            });
            const sortedAcc = [...activeFixedAcc, ...db[selectedDate].acc].sort((a, b) => b.id - a.id);
            sortedAcc.forEach((i) => {
                dayTotal += i.amount;
                const li = document.createElement('li'); li.className = 'list-item';
                const periodLabel = i.fixedPeriod === 'weekday' ? '(월~금)' : '(고정)';
                li.innerHTML = `<div class="item-info"><small>${i.category} ${i.isFixed ? periodLabel : ''}</small><div class="name">${i.desc}</div></div><div class="amount-area"><span>${i.amount.toLocaleString()}원</span><button class="btn-icon-del" onclick="removeAcc(${i.isFixed}, ${i.id})">🗑️</button></div>`;
                accList.appendChild(li);
            });
            document.getElementById('day-expense').innerText = dayTotal.toLocaleString() + "원";

            // 2. 할 일 렌더링 (시간 내림차순 정렬 적용)
            const todoList = document.getElementById('todo-list'); todoList.innerHTML = '';
            const activeFixedTodo = fixedTodo.filter(item => {
                if (item.fixedPeriod === 'weekday') return isWeekday;
                return true;
            });
            
            // [개선 포인트] 시간 기준 내림차순 정렬
            const sortedTodo = [...activeFixedTodo, ...db[selectedDate].todo].sort((a, b) => {
                // 1순위: 시간(time) 내림차순 (예: 08:00 이 07:30 보다 위로)
                if (b.time !== a.time) {
                    return b.time.localeCompare(a.time);
                }
                // 2순위: 시간이 같으면 ID 내림차순 (최신 등록순)
                return b.id - a.id;
            });
            
            let pendingCount = 0;
            sortedTodo.forEach((t) => {
                const isDone = db[selectedDate].done.includes(String(t.id));
                if (!isDone) pendingCount++;
                const li = document.createElement('li'); li.className = `list-item ${isDone ? 'done' : ''}`;
                
                li.innerHTML = `
                    <div class="todo-item" onclick="toggleTodo('${t.id}')">
                        <div class="t-icon"></div>
                        <div class="item-info">
                            <small>${t.time} ${t.isFixed ? '(반복)' : ''}</small>
                            <div class="name">${t.text}</div>
                        </div>
                    </div>
                    <button class="btn-icon-del" onclick="removeTodo(${t.isFixed}, ${t.id})">🗑️</button>`;
                todoList.appendChild(li);
            });
            document.getElementById('day-todo-count').innerText = pendingCount + "개";
        }

        function renderDayStrip() {
            const strip = document.getElementById('day-strip'); strip.innerHTML = '';
            let d = new Date(selectedDate); d.setDate(d.getDate() - d.getDay());
            for (let i = 0; i < 7; i++) {
                const dK = toDateKey(d);
                const item = document.createElement('div');
                item.className = `strip-item ${dK === selectedDate ? 'active' : ''}`;
                item.innerHTML = `<span>${['일', '월', '화', '수', '목', '금', '토'][d.getDay()]}</span><strong>${d.getDate()}</strong>`;
                item.onclick = () => { selectedDate = dK; render(); };
                strip.appendChild(item);
                d.setDate(d.getDate() + 1);
            }
        }

        function setToday() { selectedDate = realToday; render(); }
        function moveDay(v) { let d = new Date(selectedDate); d.setDate(d.getDate() + v); selectedDate = toDateKey(d); render(); }
        function editDailyMsg() { const n = prompt(`${selectedDate}의 한마디 수정`, getEffectiveMsg(selectedDate)); if (n !== null) { db[selectedDate].msg = n; save(); render(); } }
        function toggleTodo(id) { const dArr = db[selectedDate].done; const idx = dArr.indexOf(String(id)); if (idx > -1) dArr.splice(idx, 1); else dArr.push(String(id)); save(); render(); }

        function addDailyEntry() {
            const d = document.getElementById('acc-desc'), a = document.getElementById('acc-amount'), c = document.getElementById('acc-cat'), f = document.getElementById('acc-fixed'), p = document.getElementById('acc-fixed-period');
            if (!d.value || !a.value) return;
            const newItem = { id: Date.now(), category: c.value, desc: d.value, amount: parseInt(a.value), isFixed: f.checked, fixedPeriod: p.value };
            if (f.checked) fixedAcc.push(newItem); else db[selectedDate].acc.push(newItem);
            save(); render(); d.value = ''; a.value = ''; f.checked = false;
        }

        function addDailyTodo() {
            const i = document.getElementById('todo-input'), t = document.getElementById('todo-time'), r = document.getElementById('todo-repeat'), p = document.getElementById('todo-repeat-period');
            if (!i.value) return;
            const newItem = { id: Date.now(), time: t.value, text: i.value, isFixed: r.checked, fixedPeriod: p.value };
            if (r.checked) fixedTodo.push(newItem); else db[selectedDate].todo.push(newItem);
            save(); render(); i.value = ''; r.checked = false;
        }

        function removeAcc(f, id) { if (f) fixedAcc = fixedAcc.filter(x => x.id !== id); else db[selectedDate].acc = db[selectedDate].acc.filter(x => x.id !== id); save(); render(); }
        function removeTodo(f, id) { if (f) fixedTodo = fixedTodo.filter(x => x.id !== id); else db[selectedDate].todo = db[selectedDate].todo.filter(x => x.id !== id); save(); render(); }
        function switchTab(t) { document.querySelectorAll('.m-tab').forEach(b => b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); event.currentTarget.classList.add('active'); document.getElementById('section-' + t).classList.add('active'); }
        function closeModal() { document.getElementById('report-modal').style.display = 'none'; }

        function showReport() {
            const weeklyBody = document.getElementById('report-weekly-body'), monthlyBody = document.getElementById('report-monthly-body');
            weeklyBody.innerHTML = ''; let weekTotal = 0;
            for (let i = 0; i < 7; i++) {
                let temp = new Date(); temp.setDate(temp.getDate() - i);
                let dK = toDateKey(temp);
                let dOfWeek = temp.getDay();
                let dExp = fixedAcc.filter(item => {
                    if (item.fixedPeriod === 'weekday') return dOfWeek >= 1 && dOfWeek <= 5;
                    return true;
                }).reduce((a, b) => a + b.amount, 0);
                if (db[dK]) dExp += (db[dK].acc || []).reduce((a, b) => a + b.amount, 0);
                weekTotal += dExp;
                weeklyBody.innerHTML += `<div class="report-row"><span>${dK.substring(5)}</span><strong>${dExp.toLocaleString()}원</strong></div>`;
            }
            const curM = selectedDate.substring(0, 7); let monT = 0;
            Object.keys(db).forEach(k => {
                if (k.startsWith(curM)) {
                    const dObj = new Date(k);
                    const dow = dObj.getDay();
                    const fExp = fixedAcc.filter(item => {
                        if (item.fixedPeriod === 'weekday') return dow >= 1 && dow <= 5;
                        return true;
                    }).reduce((a, b) => a + b.amount, 0);
                    monT += fExp + (db[k].acc || []).reduce((s, i) => s + i.amount, 0);
                }
            });
            monthlyBody.innerHTML = `<div class="month-main-val">${monT.toLocaleString()}원</div><div class="month-info-sub">이번 달 합계 (${curM})</div>`;
            document.getElementById('report-modal').style.display = 'flex';
        }
        document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('dark-mode'); document.getElementById('theme-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙'; });
    </script>
</body>

</html>
