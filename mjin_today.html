<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mjin Daily Manager (Cloud Sync)</title>
    <style>
        /* CSS는 기존 카카오 스타일을 유지하면서 동기화 바를 추가했습니다 */
        :root { --yellow: #FEE500; --black: #1E1E1E; --bg: #F6F6F6; --card: #FFFFFF; --txt1: #222222; --txt2: #888888; --line: #EAEAEA; --radius: 12px; }
        body.dark-mode { --bg: #111111; --card: #222222; --txt1: #EEEEEE; --txt2: #AAAAAA; --line: #333333; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--txt1); display: flex; justify-content: center; }
        .mobile-container { width: 100%; max-width: 480px; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
        
        /* 동기화 바 스타일 */
        .sync-header { background: var(--black); padding: 12px 15px; display: flex; gap: 8px; align-items: center; }
        .sync-input { flex: 1; background: #333; border: 1px solid #444; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; }
        .btn-sync { background: var(--yellow); border: none; padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
        .sync-status { font-size: 10px; color: #888; margin-top: 2px; }

        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
        .logo { font-size: 20px; font-weight: 800; margin: 0; }
        .day-strip { display: flex; justify-content: space-around; padding: 10px 5px; background: var(--card); border-bottom: 1px solid var(--line); }
        .strip-item { display: flex; flex-direction: column; align-items: center; width: 13%; padding: 8px 0; cursor: pointer; border-radius: 10px; }
        .strip-item.active { background: var(--yellow); color: #000; font-weight: 800; }
        .strip-item span { font-size: 10px; margin-bottom: 4px; }
        
        .week-nav { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 15px; background: var(--card); }
        .view-date-text { font-size: 16px; font-weight: 800; }
        .nav-arrow { border: 1px solid var(--line); background: var(--card); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        
        .daily-msg-section { padding: 10px 15px; background: var(--card); border-bottom: 1px solid var(--line); }
        .msg-box { background: var(--bg); padding: 12px; border-radius: 10px; display: flex; gap: 10px; cursor: pointer; }
        
        .day-summary { display: flex; padding: 15px; gap: 10px; }
        .sum-box { flex: 1; background: var(--card); padding: 15px; border-radius: var(--radius); border: 1px solid var(--line); text-align: center; }
        .sum-box .val { font-size: 16px; font-weight: 800; display: block; }

        .main-tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
        .m-tab { flex: 1; padding: 15px; border: none; background: none; color: var(--txt2); font-weight: 700; cursor: pointer; }
        .m-tab.active { color: var(--txt1); border-bottom: 3px solid var(--yellow); }

        .content { padding: 15px; }
        .input-form { background: var(--card); padding: 15px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; gap: 8px; }
        .kakao-input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 14px; width: 100%; color: var(--txt1); }
        .btn-add { background: var(--yellow); border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }

        .kakao-list { list-style: none; padding: 0; margin: 0; }
        .list-item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .list-item.done { opacity: 0.4; }
        .item-info .name { font-size: 15px; font-weight: 600; }
        .btn-icon-del { background: #f1f1f1; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); width: 85%; padding: 20px; border-radius: 15px; text-align: center; }
    </style>
</head>

<body>
    <div class="mobile-container">
        <!-- 동기화 바 (어디서든 연동 가능하게 하는 핵심) -->
        <div class="sync-header">
            <input type="password" id="sync-key" class="sync-input" placeholder="비밀 코드 입력 (예: mjin777)">
            <button onclick="syncData('load')" class="btn-sync" style="background:#555; color:white;">불러오기</button>
            <button onclick="syncData('save')" class="btn-sync">서버저장</button>
        </div>

        <header class="app-header">
            <h1 class="logo">mjin</h1>
            <div>
                <button onclick="showReport()" class="btn-sync" style="background:var(--line)">📊 리포트</button>
                <button id="theme-toggle" class="btn-sync" style="background:var(--line)">🌙</button>
            </div>
        </header>

        <div id="day-strip" class="day-strip"></div>

        <nav class="week-nav">
            <button onclick="moveDay(-1)" class="nav-arrow">＜</button>
            <span id="current-focus-date" class="view-date-text"></span>
            <button onclick="moveDay(1)" class="nav-arrow">＞</button>
        </nav>

        <section class="daily-msg-section">
            <div class="msg-box" onclick="editDailyMsg()">
                <p id="daily-msg-text">오늘의 한마디를 입력하세요.</p>
            </div>
        </section>

        <section class="day-summary">
            <div class="sum-box"><span class="label">오늘 지출</span><span class="val" id="day-expense">0원</span></div>
            <div class="sum-box"><span class="label">남은 할일</span><span class="val" id="day-todo-count">0개</span></div>
        </section>

        <div class="main-tabs">
            <button class="m-tab active" id="tab-acc" onclick="switchTab('acc')">💰 가계부</button>
            <button class="m-tab" id="tab-todo" onclick="switchTab('todo')">✅ 할 일</button>
        </div>

        <main class="content">
            <div id="section-acc" class="tab-content">
                <div class="input-form">
                    <div class="row">
                        <select id="acc-cat" class="kakao-input" style="flex:0.4"><option>식비</option><option>교통비</option><option>쇼핑</option><option>기타</option></select>
                        <input type="number" id="acc-amount" class="kakao-input" placeholder="금액" style="flex:0.6">
                    </div>
                    <input type="text" id="acc-desc" class="kakao-input" placeholder="상세 내역">
                    <button onclick="addEntry()" class="btn-add">가계부 등록</button>
                </div>
                <ul id="acc-list" class="kakao-list"></ul>
            </div>

            <div id="section-todo" class="tab-content" style="display:none;">
                <div class="input-form">
                    <input type="text" id="todo-input" class="kakao-input" placeholder="할 일 입력">
                    <button onclick="addTodo()" class="btn-add">할 일 등록</button>
                </div>
                <ul id="todo-list" class="kakao-list"></ul>
            </div>
        </main>
    </div>

    <div id="report-modal" class="modal">
        <div class="modal-content">
            <h3>주간 리포트</h3>
            <div id="report-body"></div>
            <button onclick="closeModal()" class="btn-add" style="width:100%; margin-top:15px;">닫기</button>
        </div>
    </div>

    <script>
        // 1. 초기 설정
        let db = JSON.parse(localStorage.getItem('mjin_db_v1')) || {};
        const toDateKey = (d) => d.toISOString().split('T')[0];
        let selectedDate = toDateKey(new Date());

        // 2. 핵심 동기화 기능 (서버 없이 코드 하나로 연동)
        async function syncData(mode) {
            const key = document.getElementById('sync-key').value;
            if(!key) return alert("비밀 코드를 입력해주세요!");
            
            const url = `https://kvdb.io/S8mUqP6C9G9R1E6hLp6Q7a/${key}`;
            
            if(mode === 'save') {
                try {
                    await fetch(url, { method: 'POST', body: JSON.stringify(db) });
                    alert("성공적으로 서버에 저장되었습니다!");
                } catch(e) { alert("저장 실패"); }
            } else {
                try {
                    const res = await fetch(url);
                    if(res.ok) {
                        db = await res.json();
                        localStorage.setItem('mjin_db_v1', JSON.stringify(db));
                        render();
                        alert("데이터를 성공적으로 불러왔습니다!");
                    } else { alert("저장된 데이터가 없습니다."); }
                } catch(e) { alert("불러오기 실패"); }
            }
        }

        // 3. 앱 기능 로직
        function render() {
            if(!db[selectedDate]) db[selectedDate] = { acc:[], todo:[], done:[], msg:"" };
            const dayData = db[selectedDate];
            
            document.getElementById('current-focus-date').innerText = selectedDate;
            document.getElementById('daily-msg-text').innerText = dayData.msg || "한마디를 입력하세요.";
            
            // 가계부 리스트
            const accList = document.getElementById('acc-list'); accList.innerHTML = '';
            let total = 0;
            dayData.acc.forEach((item, idx) => {
                total += parseInt(item.amount);
                accList.innerHTML += `<li class="list-item"><div><small>${item.cat}</small><div class="name">${item.desc}</div></div><div><strong>${parseInt(item.amount).toLocaleString()}원</strong> <button class="btn-icon-del" onclick="deleteItem('acc', ${idx})">🗑️</button></div></li>`;
            });
            document.getElementById('day-expense').innerText = total.toLocaleString() + "원";

            // 할 일 리스트
            const todoList = document.getElementById('todo-list'); todoList.innerHTML = '';
            let pending = 0;
            dayData.todo.forEach((item, idx) => {
                const isDone = dayData.done.includes(idx);
                if(!isDone) pending++;
                todoList.innerHTML += `<li class="list-item ${isDone?'done':''}" onclick="toggleTodo(${idx})"><div><div class="name">${item}</div></div><button class="btn-icon-del" onclick="deleteItem('todo', ${idx}); event.stopPropagation();">🗑️</button></li>`;
            });
            document.getElementById('day-todo-count').innerText = pending + "개";
            
            renderDayStrip();
            localStorage.setItem('mjin_db_v1', JSON.stringify(db));
        }

        function renderDayStrip() {
            const strip = document.getElementById('day-strip'); strip.innerHTML = '';
            let d = new Date(selectedDate);
            d.setDate(d.getDate() - 3);
            for(let i=0; i<7; i++) {
                const dateKey = toDateKey(d);
                const active = dateKey === selectedDate ? 'active' : '';
                strip.innerHTML += `<div class="strip-item ${active}" onclick="selectDate('${dateKey}')"><span>${d.getDate()}일</span></div>`;
                d.setDate(d.getDate() + 1);
            }
        }

        function selectDate(key) { selectedDate = key; render(); }
        function moveDay(v) { let d = new Date(selectedDate); d.setDate(d.getDate()+v); selectedDate = toDateKey(d); render(); }

        function addEntry() {
            const cat = document.getElementById('acc-cat').value, amt = document.getElementById('acc-amount').value, desc = document.getElementById('acc-desc').value;
            if(!amt || !desc) return;
            db[selectedDate].acc.push({cat, amount: amt, desc});
            render();
        }

        function addTodo() {
            const val = document.getElementById('todo-input').value;
            if(!val) return;
            db[selectedDate].todo.push(val);
            render();
        }

        function toggleTodo(idx) {
            const doneList = db[selectedDate].done;
            if(doneList.includes(idx)) db[selectedDate].done = doneList.filter(i => i !== idx);
            else doneList.push(idx);
            render();
        }

        function deleteItem(type, idx) {
            db[selectedDate][type].splice(idx, 1);
            render();
        }

        function editDailyMsg() {
            const msg = prompt("오늘의 한마디", db[selectedDate].msg);
            if(msg !== null) { db[selectedDate].msg = msg; render(); }
        }

        function switchTab(type) {
            document.getElementById('section-acc').style.display = type === 'acc' ? 'block' : 'none';
            document.getElementById('section-todo').style.display = type === 'todo' ? 'block' : 'none';
            document.getElementById('tab-acc').classList.toggle('active', type === 'acc');
            document.getElementById('tab-todo').classList.toggle('active', type === 'todo');
        }

        function showReport() {
            const body = document.getElementById('report-body'); body.innerHTML = '';
            Object.keys(db).sort().reverse().slice(0, 7).forEach(date => {
                let sum = db[date].acc.reduce((s, i) => s + parseInt(i.amount), 0);
                body.innerHTML += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;"><span>${date}</span><strong>${sum.toLocaleString()}원</strong></div>`;
            });
            document.getElementById('report-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('report-modal').style.display = 'none'; }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        render();
    </script>
</body>
</html>
