<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mjin Daily Manager (Auto Sync)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 상단 연동 상태바 */
        .sync-status-bar { background: #1e1e1e; color: #fff; padding: 8px 15px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff9800; display: inline-block; margin-right: 5px; }
        .sync-dot.online { background: #4caf50; }
        .btn-copy-link { background: #444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- 1. 실시간 연동 상태바 추가 -->
        <div class="sync-status-bar">
            <span><span class="sync-dot" id="sync-dot"></span> <span id="sync-text">연결 중...</span></span>
            <button class="btn-copy-link" onclick="copyMyLink()">🔗 전용 링크 복사</button>
        </div>

        <header class="app-header">
            <div class="header-left"><h1 class="logo">mjin</h1></div>
            <div class="header-right">
                <button onclick="showReport()" class="btn-report">📊 리포트</button>
                <button id="theme-toggle" class="btn-theme">🌙</button>
            </div>
        </header>

        <div id="day-strip" class="day-strip"></div>

        <nav class="week-nav">
            <button onclick="moveDay(-1)" class="nav-arrow arrow-prev"></button>
            <div class="nav-center">
                <span id="current-focus-date" class="view-date-text"></span>
                <button onclick="setToday()" class="btn-today-mini">오늘</button>
            </div>
            <button onclick="moveDay(1)" class="nav-arrow arrow-prev" style="transform: rotate(180deg);"></button>
        </nav>

        <section class="daily-msg-section" onclick="editDailyMsg()">
            <div class="msg-box"><span class="msg-icon">💬</span>
                <p id="daily-msg-text">한마디를 입력해주세요.</p>
            </div>
        </section>

        <section class="day-summary">
            <div class="sum-box"><span class="label">이 날의 지출</span><span class="val" id="day-expense">0</span></div>
            <div class="sum-box"><span class="label">남은 할일</span><span class="val" id="day-todo-count">0</span></div>
        </section>

        <div class="main-tabs">
            <button class="m-tab active" onclick="switchTab('acc')">💰 가계부</button>
            <button class="m-tab" onclick="switchTab('todo')">✅ 할 일</button>
        </div>

        <main class="content">
            <div id="section-acc" class="tab-content active">
                <div class="input-form">
                    <div class="row">
                        <select id="acc-cat" class="kakao-input cat-select" style="flex:0.4">
                            <option value="식비">🍔 식비</option>
                            <option value="교통비">🚌 교통비</option>
                            <option value="문화비">🎬 문화비</option>
                            <option value="쇼핑">🛍️ 쇼핑</option>
                            <option value="기타">✨ 기타</option>
                        </select>
                        <input type="number" id="acc-amount" class="kakao-input" placeholder="금액" style="flex:0.6">
                    </div>
                    <div class="row"><input type="text" id="acc-desc" class="kakao-input" placeholder="상세 내역 입력" style="flex:1"></div>
                    <div class="row-sub">
                        <div class="fixed-options">
                            <label class="check-label"><input type="checkbox" id="acc-fixed"> 고정지출</label>
                            <select id="acc-fixed-period" class="kakao-input cat-select"><option value="every">매일</option><option value="weekday">월~금</option></select>
                        </div>
                        <button onclick="addDailyEntry()" class="btn-add">등록</button>
                    </div>
                </div>
                <ul id="acc-list" class="kakao-list"></ul>
            </div>

            <div id="section-todo" class="tab-content">
                <div class="input-form">
                    <div class="row">
                        <input type="time" id="todo-time" class="kakao-input" style="flex:0.3" value="08:00">
                        <input type="text" id="todo-input" class="kakao-input" placeholder="할 일 입력" style="flex:0.7">
                    </div>
                    <div class="row-sub">
                        <div class="fixed-options">
                            <label class="check-label"><input type="checkbox" id="todo-repeat"> 반복일정</label>
                            <select id="todo-repeat-period" class="kakao-input cat-select"><option value="every">매일</option><option value="weekday">월~금</option></select>
                        </div>
                        <button onclick="addDailyTodo()" class="btn-add">등록</button>
                    </div>
                </div>
                <ul id="todo-list" class="kakao-list"></ul>
            </div>
        </main>
    </div>

    <div id="report-modal" class="modal">
        <div class="modal-content">
            <h3>소비 리포트</h3>
            <div id="report-weekly-body"></div>
            <div class="report-month-box" id="report-monthly-body"></div>
            <button onclick="closeModal()" class="btn-close">닫기</button>
        </div>
    </div>

    <script>
        // --- 1. 실시간 연동 키 설정 ---
        const urlParams = new URLSearchParams(window.location.search);
        let MY_KEY = urlParams.get('key');
        if (!MY_KEY) {
            MY_KEY = 'mj_' + Math.random().toString(36).substring(2, 11);
            const newUrl = window.location.origin + window.location.pathname + '?key=' + MY_KEY;
            window.history.replaceState({}, '', newUrl);
        }

        const API_URL = `https://kvdb.io/S8mUqP6C9G9R1E6hLp6Q7a/${MY_KEY}`;

        function copyMyLink() {
            const link = window.location.href;
            navigator.clipboard.writeText(link).then(() => alert("전용 링크가 복사되었습니다! 이 링크를 PC나 다른 폰에서 여세요."));
        }

        // --- 2. 데이터 초기화 (로컬 우선) ---
        let db = JSON.parse(localStorage.getItem('mj_db')) || {};
        let fixedAcc = JSON.parse(localStorage.getItem('mj_fix_acc')) || [];
        let fixedTodo = JSON.parse(localStorage.getItem('mj_fix_todo')) || [];

        const toDateKey = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };
        let selectedDate = toDateKey(new Date());

        // --- 3. 실시간 동기화 함수 ---
        async function cloudLoad() {
            try {
                const res = await fetch(API_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (JSON.stringify(data) !== JSON.stringify({db, fixedAcc, fixedTodo})) {
                        db = data.db || db;
                        fixedAcc = data.fixedAcc || fixedAcc;
                        fixedTodo = data.fixedTodo || fixedTodo;
                        render();
                    }
                    document.getElementById('sync-dot').classList.add('online');
                    document.getElementById('sync-text').innerText = "실시간 연동 중";
                }
            } catch (e) { document.getElementById('sync-text').innerText = "오프라인 모드"; }
        }

        async function save() {
            // 로컬에 즉시 저장
            localStorage.setItem('mj_db', JSON.stringify(db));
            localStorage.setItem('mj_fix_acc', JSON.stringify(fixedAcc));
            localStorage.setItem('mj_fix_todo', JSON.stringify(fixedTodo));
            render();

            // 클라우드에 백그라운드 전송
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ db, fixedAcc, fixedTodo })
                });
            } catch (e) { console.log("저장 지연 중..."); }
        }

        window.onload = () => {
            cloudLoad();
            setInterval(cloudLoad, 10000); // 10초마다 자동으로 바뀐 내용 있는지 체크
            render();
        };

        // --- 4. 기본 기능 로직 (최종 파일과 동일) ---
        function getEffectiveMsg(dateStr) {
            if (db[dateStr] && db[dateStr].msg) return db[dateStr].msg;
            const pastDates = Object.keys(db).filter(d => d < dateStr && db[d].msg).sort().reverse();
            return pastDates.length > 0 ? db[pastDates[0]].msg : "오늘의 한마디를 입력해보세요.";
        }

        function render() {
            if (!db[selectedDate]) db[selectedDate] = { acc: [], todo: [], done: [], msg: "" };
            if (!db[selectedDate].done) db[selectedDate].done = [];
            
            document.getElementById('current-focus-date').innerText = selectedDate.replace(/-/g, '.');
            document.getElementById('daily-msg-text').innerText = getEffectiveMsg(selectedDate);
            renderDayStrip();

            const isWeekday = [1,2,3,4,5].includes(new Date(selectedDate).getDay());

            const accList = document.getElementById('acc-list'); accList.innerHTML = '';
            let dayTotal = 0;
            const currentAcc = [...fixedAcc, ...db[selectedDate].acc].sort((a,b)=>b.id-a.id);
            currentAcc.forEach(i => {
                dayTotal += i.amount;
                accList.innerHTML += `<li class="list-item"><div class="item-info"><small>${i.category}</small><div class="name">${i.desc}</div></div><div class="amount-area"><span>${i.amount.toLocaleString()}원</span><button class="btn-icon-del" onclick="removeAcc(${i.isFixed}, ${i.id})">🗑️</button></div></li>`;
            });
            document.getElementById('day-expense').innerText = dayTotal.toLocaleString() + "원";

            const todoList = document.getElementById('todo-list'); todoList.innerHTML = '';
            const currentTodo = [...fixedTodo, ...db[selectedDate].todo].sort((a,b)=>b.id-a.id);
            let pending = 0;
            currentTodo.forEach(t => {
                const isDone = db[selectedDate].done.includes(String(t.id));
                if (!isDone) pending++;
                todoList.innerHTML += `<li class="list-item ${isDone?'done':''}"><div class="todo-item" onclick="toggleTodo('${t.id}')"><div class="t-icon"></div><div class="item-info"><small>${t.time}</small><div class="name">${t.text}</div></div></div><button class="btn-icon-del" onclick="removeTodo(${t.isFixed}, ${t.id})">🗑️</button></li>`;
            });
            document.getElementById('day-todo-count').innerText = pending + "개";
        }

        function renderDayStrip() {
            const strip = document.getElementById('day-strip'); strip.innerHTML = '';
            let d = new Date(selectedDate); d.setDate(d.getDate() - d.getDay());
            for (let i = 0; i < 7; i++) {
                const dK = toDateKey(d);
                const item = document.createElement('div');
                item.className = `strip-item ${dK === selectedDate ? 'active' : ''}`;
                item.innerHTML = `<span>${['일','월','화','수','목','금','토'][d.getDay()]}</span><strong>${d.getDate()}</strong>`;
                item.onclick = () => { selectedDate = dK; render(); };
                strip.appendChild(item);
                d.setDate(d.getDate() + 1);
            }
        }

        function setToday() { selectedDate = toDateKey(new Date()); render(); }
        function moveDay(v) { let d = new Date(selectedDate); d.setDate(d.getDate()+v); selectedDate = toDateKey(d); render(); }
        function editDailyMsg() { const n = prompt(`한마디 수정`, getEffectiveMsg(selectedDate)); if (n!==null) { db[selectedDate].msg = n; save(); } }
        function toggleTodo(id) { 
            const dArr = db[selectedDate].done; const idx = dArr.indexOf(String(id)); 
            if (idx > -1) dArr.splice(idx, 1); else dArr.push(String(id)); 
            save(); 
        }

        function addDailyEntry() {
            const d = document.getElementById('acc-desc'), a = document.getElementById('acc-amount'), c = document.getElementById('acc-cat'), f = document.getElementById('acc-fixed');
            if (!d.value || !a.value) return;
            const item = { id: Date.now(), category: c.value, desc: d.value, amount: parseInt(a.value), isFixed: f.checked };
            if (f.checked) fixedAcc.push(item); else db[selectedDate].acc.push(item);
            save(); d.value = ''; a.value = ''; f.checked = false;
        }

        function addDailyTodo() {
            const i = document.getElementById('todo-input'), t = document.getElementById('todo-time'), r = document.getElementById('todo-repeat');
            if (!i.value) return;
            const item = { id: Date.now(), time: t.value, text: i.value, isFixed: r.checked };
            if (r.checked) fixedTodo.push(item); else db[selectedDate].todo.push(item);
            save(); i.value = ''; r.checked = false;
        }

        function removeAcc(f, id) { if (f) fixedAcc = fixedAcc.filter(x => x.id !== id); else db[selectedDate].acc = db[selectedDate].acc.filter(x => x.id !== id); save(); }
        function removeTodo(f, id) { if (f) fixedTodo = fixedTodo.filter(x => x.id !== id); else db[selectedDate].todo = db[selectedDate].todo.filter(x => x.id !== id); save(); }
        function switchTab(t) { document.querySelectorAll('.m-tab').forEach(b => b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); event.currentTarget.classList.add('active'); document.getElementById('section-' + t).classList.add('active'); }
        function closeModal() { document.getElementById('report-modal').style.display = 'none'; }

        function showReport() {
            const weeklyBody = document.getElementById('report-weekly-body'), monthlyBody = document.getElementById('report-monthly-body');
            weeklyBody.innerHTML = ''; let weekTotal = 0;
            for (let i = 0; i < 7; i++) {
                let temp = new Date(); temp.setDate(temp.getDate() - i);
                let dK = toDateKey(temp);
                let dExp = (db[dK] && db[dK].acc ? db[dK].acc.reduce((a,b)=>a+b.amount,0) : 0) + fixedAcc.reduce((a,b)=>a+b.amount,0);
                weekTotal += dExp;
                weeklyBody.innerHTML += `<div class="report-row"><span>${dK.substring(5)}</span><strong>${dExp.toLocaleString()}원</strong></div>`;
            }
            monthlyBody.innerHTML = `<div class="month-main-val">${weekTotal.toLocaleString()}원</div><div class="month-info-sub">최근 7일 지출 합계</div>`;
            document.getElementById('report-modal').style.display = 'flex';
        }
        document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('dark-mode'); document.getElementById('theme-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙'; });
    </script>
</body>
</html>
