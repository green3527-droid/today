<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mjin Daily Manager (Cloud Sync)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK 추가 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>

<body>
    <div class="mobile-container">
        <!-- 상단 로그인 상태바 -->
        <div id="auth-bar" class="sync-bar" style="background:#444; color:white; font-size:10px; display:flex; justify-content:space-between; align-items:center; padding: 5px 15px;">
            <span id="user-info">로그인이 필요합니다.</span>
            <button id="login-btn" onclick="handleAuth()" style="padding:4px 8px; font-size:10px; background:var(--yellow); border:none; border-radius:4px; font-weight:bold;">로그인</button>
        </div>

        <header class="app-header">
            <div class="header-left"><h1 class="logo">mjin</h1></div>
            <div class="header-right">
                <button onclick="showReport()" class="btn-report">📊 리포트</button>
                <button id="theme-toggle" class="btn-theme">🌙</button>
            </div>
        </header>

        <div id="day-strip" class="day-strip"></div>

        <nav class="week-nav">
            <button onclick="moveDay(-1)" class="nav-arrow arrow-prev"></button>
            <div class="nav-center">
                <span id="current-focus-date" class="view-date-text"></span>
                <button onclick="setToday()" class="btn-today-mini">오늘</button>
            </div>
            <button onclick="moveDay(1)" class="nav-arrow arrow-next"></button>
        </nav>

        <section class="daily-msg-section" onclick="editDailyMsg()">
            <div class="msg-box"><span class="msg-icon">💬</span>
                <p id="daily-msg-text">로그인 후 데이터를 불러오는 중...</p>
            </div>
        </section>

        <section class="day-summary">
            <div class="sum-box"><span class="label">이 날의 지출</span><span class="val" id="day-expense">0</span></div>
            <div class="sum-box"><span class="label">남은 할일</span><span class="val" id="day-todo-count">0</span></div>
        </section>

        <div class="main-tabs">
            <button class="m-tab active" onclick="switchTab('acc')">💰 가계부</button>
            <button class="m-tab" onclick="switchTab('todo')">✅ 할 일</button>
        </div>

        <main class="content">
            <div id="section-acc" class="tab-content active">
                <div class="input-form">
                    <div class="row">
                        <select id="acc-cat" class="kakao-input cat-select" style="flex:0.4">
                            <option value="식비">🍔 식비</option>
                            <option value="교통비">🚌 교통비</option>
                            <option value="문화비">🎬 문화비</option>
                            <option value="쇼핑">🛍️ 쇼핑</option>
                            <option value="기타">✨ 기타</option>
                        </select>
                        <input type="number" id="acc-amount" class="kakao-input" placeholder="금액" style="flex:0.6">
                    </div>
                    <div class="row"><input type="text" id="acc-desc" class="kakao-input" placeholder="상세 내역" style="flex:1"></div>
                    <div class="row-sub">
                        <div class="fixed-options">
                            <label><input type="checkbox" id="acc-fixed"> 고정지출</label>
                            <select id="acc-fixed-period" class="kakao-input-mini"><option value="every">매일</option><option value="weekday">월~금</option></select>
                        </div>
                        <button onclick="addDailyEntry()" class="btn-add">등록</button>
                    </div>
                </div>
                <ul id="acc-list" class="kakao-list"></ul>
            </div>

            <div id="section-todo" class="tab-content">
                <div class="input-form">
                    <div class="row">
                        <input type="time" id="todo-time" class="kakao-input" style="flex:0.3" value="08:00">
                        <input type="text" id="todo-input" class="kakao-input" placeholder="할 일 입력" style="flex:0.7">
                    </div>
                    <div class="row-sub">
                        <div class="fixed-options">
                            <label><input type="checkbox" id="todo-repeat"> 반복</label>
                            <select id="todo-repeat-period" class="kakao-input-mini"><option value="every">매일</option><option value="weekday">월~금</option></select>
                        </div>
                        <button onclick="addDailyTodo()" class="btn-add">등록</button>
                    </div>
                </div>
                <ul id="todo-list" class="kakao-list"></ul>
            </div>
        </main>
    </div>

    <div id="report-modal" class="modal">
        <div class="modal-content">
            <h3>소비 리포트</h3>
            <div id="report-weekly-body"></div>
            <div class="report-month-box" id="report-monthly-body"></div>
            <button onclick="closeModal()" class="btn-close">닫기</button>
        </div>
    </div>

    <script>
        // --- 1. Firebase 초기화 (본인 설정값으로 교체) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // --- 2. 상태 변수 ---
        let db = {};
        let fixedAcc = [];
        let fixedTodo = [];
        let currentUser = null;
        const realToday = new Date().toISOString().split('T')[0];
        let selectedDate = realToday;

        // --- 3. 로그인 및 데이터 동기화 로직 ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('user-info').innerText = user.displayName + "님 연결됨";
                document.getElementById('login-btn').innerText = "로그아웃";
                
                // 해당 유저의 데이터 경로 감시 (실시간 동기화)
                database.ref('users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    db = data.db || {};
                    fixedAcc = data.fixedAcc || [];
                    fixedTodo = data.fixedTodo || [];
                    render();
                });
            } else {
                currentUser = null;
                document.getElementById('user-info').innerText = "로그인이 필요합니다.";
                document.getElementById('login-btn').innerText = "로그인";
                db = {}; fixedAcc = []; fixedTodo = [];
                render();
            }
        });

        function handleAuth() {
            if (currentUser) {
                if(confirm("로그아웃 하시겠습니까?")) auth.signOut();
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider);
            }
        }

        function save() {
            if (!currentUser) return;
            database.ref('users/' + currentUser.uid).set({
                db: db,
                fixedAcc: fixedAcc,
                fixedTodo: fixedTodo
            });
        }

        // --- 4. 앱 로직 (기존과 거의 동일, 로컬스토리지 부분만 제거) ---
        const toDateKey = (date) => date.toISOString().split('T')[0];

        function getEffectiveMsg(dateStr) {
            if (db[dateStr] && db[dateStr].msg) return db[dateStr].msg;
            const pastDates = Object.keys(db).filter(d => d < dateStr && db[d].msg).sort().reverse();
            return pastDates.length > 0 ? db[pastDates[0]].msg : "오늘의 한마디를 입력해보세요.";
        }

        function render() {
            if (!db[selectedDate]) db[selectedDate] = { acc: [], todo: [], done: [], msg: "" };
            document.getElementById('current-focus-date').innerText = selectedDate.replace(/-/g, '.');
            document.getElementById('daily-msg-text').innerText = getEffectiveMsg(selectedDate);
            renderDayStrip();

            const dayOfWeek = new Date(selectedDate).getDay();
            const isWeekday = dayOfWeek >= 1 && dayOfWeek <= 5;

            // 가계부 렌더링
            const accList = document.getElementById('acc-list'); accList.innerHTML = '';
            let dayTotal = 0;
            const activeFixedAcc = fixedAcc.filter(i => i.fixedPeriod === 'weekday' ? isWeekday : true);
            const sortedAcc = [...activeFixedAcc, ...db[selectedDate].acc].sort((a,b)=>b.id-a.id);
            sortedAcc.forEach(i => {
                dayTotal += i.amount;
                const li = document.createElement('li'); li.className = 'list-item';
                li.innerHTML = `<div class="item-info"><small>${i.category} ${i.isFixed?'(고정)':''}</small><div class="name">${i.desc}</div></div><div class="amount-area"><span>${i.amount.toLocaleString()}원</span><button class="btn-icon-del" onclick="removeAcc(${i.isFixed}, ${i.id})">🗑️</button></div>`;
                accList.appendChild(li);
            });
            document.getElementById('day-expense').innerText = dayTotal.toLocaleString() + "원";

            // 할 일 렌더링
            const todoList = document.getElementById('todo-list'); todoList.innerHTML = '';
            const activeFixedTodo = fixedTodo.filter(i => i.fixedPeriod === 'weekday' ? isWeekday : true);
            const sortedTodo = [...activeFixedTodo, ...db[selectedDate].todo].sort((a,b)=>b.id-a.id);
            let pendingCount = 0;
            sortedTodo.forEach(t => {
                const isDone = db[selectedDate].done && db[selectedDate].done.includes(String(t.id));
                if (!isDone) pendingCount++;
                const li = document.createElement('li'); li.className = `list-item ${isDone ? 'done' : ''}`;
                li.innerHTML = `<div class="todo-item" onclick="toggleTodo('${t.id}')"><div class="t-icon"></div><div class="item-info"><small>${t.time} ${t.isFixed?'(반복)':''}</small><div class="name">${t.text}</div></div></div><button class="btn-icon-del" onclick="removeTodo(${t.isFixed}, ${t.id})">🗑️</button>`;
                todoList.appendChild(li);
            });
            document.getElementById('day-todo-count').innerText = pendingCount + "개";
        }

        function renderDayStrip() {
            const strip = document.getElementById('day-strip'); strip.innerHTML = '';
            let d = new Date(selectedDate); d.setDate(d.getDate() - d.getDay());
            for (let i = 0; i < 7; i++) {
                const dK = d.toISOString().split('T')[0];
                const item = document.createElement('div');
                item.className = `strip-item ${dK === selectedDate ? 'active' : ''}`;
                item.innerHTML = `<span>${['일', '월', '화', '수', '목', '금', '토'][d.getDay()]}</span><strong>${d.getDate()}</strong>`;
                item.onclick = () => { selectedDate = dK; render(); };
                strip.appendChild(item);
                d.setDate(d.getDate() + 1);
            }
        }

        function setToday() { selectedDate = realToday; render(); }
        function moveDay(v) { let d = new Date(selectedDate); d.setDate(d.getDate() + v); selectedDate = toDateKey(d); render(); }
        function editDailyMsg() { const n = prompt(`${selectedDate}의 한마디`, getEffectiveMsg(selectedDate)); if (n!==null) { db[selectedDate].msg = n; save(); } }
        function toggleTodo(id) { 
            if(!db[selectedDate].done) db[selectedDate].done = [];
            const dArr = db[selectedDate].done; const idx = dArr.indexOf(String(id)); 
            if (idx > -1) dArr.splice(idx, 1); else dArr.push(String(id)); 
            save(); 
        }

        function addDailyEntry() {
            const d = document.getElementById('acc-desc'), a = document.getElementById('acc-amount'), c = document.getElementById('acc-cat'), f = document.getElementById('acc-fixed'), p = document.getElementById('acc-fixed-period');
            if (!d.value || !a.value) return;
            const newItem = { id: Date.now(), category: c.value, desc: d.value, amount: parseInt(a.value), isFixed: f.checked, fixedPeriod: p.value };
            if (f.checked) fixedAcc.push(newItem); else db[selectedDate].acc.push(newItem);
            save(); d.value = ''; a.value = ''; f.checked = false;
        }

        function addDailyTodo() {
            const i = document.getElementById('todo-input'), t = document.getElementById('todo-time'), r = document.getElementById('todo-repeat'), p = document.getElementById('todo-repeat-period');
            if (!i.value) return;
            const newItem = { id: Date.now(), time: t.value, text: i.value, isFixed: r.checked, fixedPeriod: p.value };
            if (r.checked) fixedTodo.push(newItem); else db[selectedDate].todo.push(newItem);
            save(); i.value = ''; r.checked = false;
        }

        function removeAcc(f, id) { if (f) fixedAcc = fixedAcc.filter(x => x.id !== id); else db[selectedDate].acc = db[selectedDate].acc.filter(x => x.id !== id); save(); }
        function removeTodo(f, id) { if (f) fixedTodo = fixedTodo.filter(x => x.id !== id); else db[selectedDate].todo = db[selectedDate].todo.filter(x => x.id !== id); save(); }
        function switchTab(t) { document.querySelectorAll('.m-tab').forEach(b => b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); event.currentTarget.classList.add('active'); document.getElementById('section-' + t).classList.add('active'); }
        function closeModal() { document.getElementById('report-modal').style.display = 'none'; }

        function showReport() {
            const weeklyBody = document.getElementById('report-weekly-body'), monthlyBody = document.getElementById('report-monthly-body');
            weeklyBody.innerHTML = ''; let weekTotal = 0;
            for (let i = 0; i < 7; i++) {
                let temp = new Date(); temp.setDate(temp.getDate() - i);
                let dK = toDateKey(temp); let dOfWeek = temp.getDay();
                let dExp = fixedAcc.filter(item => item.fixedPeriod === 'weekday' ? (dOfWeek >= 1 && dOfWeek <= 5) : true).reduce((a, b) => a + b.amount, 0);
                if (db[dK]) dExp += (db[dK].acc || []).reduce((a, b) => a + b.amount, 0);
                weekTotal += dExp;
                weeklyBody.innerHTML += `<div class="report-row"><span>${dK.substring(5)}</span><strong>${dExp.toLocaleString()}원</strong></div>`;
            }
            const curM = selectedDate.substring(0, 7); let monT = 0;
            Object.keys(db).forEach(k => {
                if (k.startsWith(curM)) {
                    const dow = new Date(k).getDay();
                    const fExp = fixedAcc.filter(item => item.fixedPeriod === 'weekday' ? (dow >= 1 && dow <= 5) : true).reduce((a, b) => a + b.amount, 0);
                    monT += fExp + (db[k].acc || []).reduce((s, i) => s + i.amount, 0);
                }
            });
            monthlyBody.innerHTML = `<div class="month-main-val">${monT.toLocaleString()}원</div><div class="month-info-sub">이번 달 합계 (${curM})</div>`;
            document.getElementById('report-modal').style.display = 'flex';
        }
        document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('dark-mode'); document.getElementById('theme-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙'; });
    </script>
</body>
</html>
