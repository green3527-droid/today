<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mjin Daily Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        /* 추가된 메모 수정 관련 스타일 */
        .memo-item {
            flex-direction: column !important;
            align-items: flex-start !important;
            gap: 8px;
        }

        .memo-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: flex-start;
            gap: 10px;
        }

        .memo-text {
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
            line-height: 1.5;
            color: var(--txt1);
            flex: 1;
            cursor: pointer;
        }

        .memo-date {
            font-size: 10px;
            color: var(--txt2);
        }

        .memo-btns {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="loading-overlay">데이터 동기화 중...</div>

    <div class="mobile-container">
        <header class="app-header">
            <div class="header-left">
                <h1 class="logo">mjin</h1>
                <span id="sync-status" style="font-size:11px; color:#999; margin-left:6px;">연결 중...</span>
            </div>
            <div class="header-right">
                <button onclick="showReport()" class="btn-report">📊 리포트</button>
                <button onclick="resetAllData()" class="btn-theme" title="초기화">🗑️</button>
                <button id="theme-toggle" class="btn-theme">🌙</button>
            </div>
        </header>

        <div id="day-strip" class="day-strip"></div>

        <nav class="week-nav">
            <button onclick="moveDay(-1)" class="nav-arrow arrow-prev" style=" transform: rotate(180deg);">
                <svg width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path opacity="0.3" d="M1 1L5 5L1 9" stroke="black" />
                </svg>
            </button>
            <div class="nav-center">
                <button id="current-focus-date" class="view-date-text calendar-open" onclick="openCalendar()" aria-label="월간 달력 열기"></button>
                <button onclick="setToday()" class="btn-today-mini">오늘</button>
            </div>
            <button onclick="moveDay(1)" class="nav-arrow arrow-next">
                <svg width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path opacity="0.3" d="M1 1L5 5L1 9" stroke="black" />
                </svg>
            </button>
        </nav>

        <div id="selected-holiday" class="selected-holiday" hidden></div>

        <section class="daily-msg-section" onclick="editDailyMsg()">
            <div class="msg-box"><span class="msg-icon">💬</span>
                <p id="daily-msg-text">한마디를 입력해주세요.</p>
            </div>
        </section>

        <section class="day-summary">
            <div class="sum-box"><span class="label">이 날의 지출</span><span class="val" id="day-expense">0</span></div>
            <div class="sum-box"><span class="label">남은 할일</span><span class="val" id="day-todo-count">0</span></div>
        </section>

        <div class="main-tabs">
            <button class="m-tab active" onclick="switchTab('acc')">💰 가계부</button>
            <button class="m-tab" onclick="switchTab('todo')">✅ 할 일</button>
            <button class="m-tab" onclick="switchTab('memo')">📝 메모</button>
        </div>

        <main class="content">
            <!-- 가계부 -->
            <div id="section-acc" class="tab-content active">
                <div class="input-form">
                    <div class="row">
                        <select id="acc-cat" class="kakao-input cat-select" style="flex:0.4">
                            <option value="식비">🍔 식비</option>
                            <option value="교통비">🚌 교통비</option>
                            <option value="문화비">🎬 문화비</option>
                            <option value="쇼핑">🛍️ 쇼핑</option>
                            <option value="기타">✨ 기타</option>
                        </select>
                        <input type="number" id="acc-amount" class="kakao-input" placeholder="금액"
                            style="flex:0.6; width: 100%;">
                    </div>
                    <div class="row"><input type="text" id="acc-desc" class="kakao-input" placeholder="상세 내역 입력"
                            style="flex:1"></div>
                    <div class="row-sub">
                        <div class="fixed-options">
                            <label class="check-label"><input type="checkbox" id="acc-fixed"> 고정지출</label>
                            <select id="acc-fixed-period" class="kakao-input cat-select">
                                <option value="every">매일</option>
                                <option value="weekday">월~금</option>
                            </select>
                        </div>
                        <button onclick="addDailyEntry()" class="btn-add">등록</button>
                    </div>
                </div>
                <ul id="acc-list" class="kakao-list"></ul>
            </div>

            <!-- 할 일 -->
            <div id="section-todo" class="tab-content">
                <div class="input-form">
                    <div class="row">
                        <input type="time" id="todo-time" class="kakao-input" style="flex:0.3" value="08:00">
                        <input type="text" id="todo-input" class="kakao-input" placeholder="할 일 입력"
                            style="flex:0.7; width: 100%;">
                    </div>
                    <div class="row-sub">
                        <div class="fixed-options">
                            <label class="check-label"><input type="checkbox" id="todo-repeat"> 반복일정</label>
                            <select id="todo-repeat-period" class="kakao-input cat-select">
                                <option value="every">매일</option>
                                <option value="weekday">월~금</option>
                            </select>
                        </div>
                        <button onclick="addDailyTodo()" class="btn-add">등록</button>
                    </div>
                </div>
                <ul id="todo-list" class="kakao-list"></ul>
            </div>

            <!-- 메모장 -->
            <div id="section-memo" class="tab-content">
                <div class="input-form">
                    <textarea id="memo-input" class="kakao-input" placeholder="여기에 메모를 작성하세요..."
                        style="width:100%; height:46.03px; resize:none; line-height:1.5; border-radius:10px;"></textarea>
                    <div class="row-sub">
                        <span></span>
                        <button onclick="addMemo()" class="btn-add">메모 저장</button>
                    </div>
                </div>
                <ul id="memo-list" class="kakao-list"></ul>
            </div>
        </main>
    </div>

    <div id="calendar-modal" class="modal" role="dialog" aria-modal="true" aria-label="월간 달력" onclick="if(event.target === this) closeCalendar()">
        <div class="modal-content calendar-content">
            <div class="calendar-heading">
                <button class="calendar-arrow" onclick="changeCalendarMonth(-1)" aria-label="이전 달">‹</button>
                <h3 id="calendar-title"></h3>
                <button class="calendar-arrow" onclick="changeCalendarMonth(1)" aria-label="다음 달">›</button>
            </div>
            <div class="calendar-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
            <div id="calendar-grid" class="calendar-grid"></div>
            <p id="holiday-status" class="holiday-status"></p>
            <button onclick="closeCalendar()" class="btn-close">닫기</button>
        </div>
    </div>

    <div id="report-modal" class="modal">
        <div class="modal-content">
            <h3>소비 리포트</h3>
            <h4 style="margin:16px 0 8px;">이번 달 · 지난 달 비교</h4>
            <div id="report-compare-body" style="display:flex; gap:10px;"></div>
            <div id="report-compare-diff" style="text-align:center; font-size:13px; margin-top:6px; color:#888;"></div>
            <h4 style="margin:16px 0 8px;">최근 7일</h4>
            <div id="report-weekly-body"></div>
            <h4 style="margin:16px 0 8px;">월별 합계</h4>
            <div class="report-month-box" id="report-monthly-body"></div>
            <button onclick="closeModal()" class="btn-close">닫기</button>
        </div>
    </div>

    <script>
        const toDateKey = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };
        const parseLocalDate = (dateStr) => {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        // 한국 공휴일: 공개 API 데이터를 연도별로 저장해 다시 방문할 때도 표시합니다.
        const holidayCache = new Map();
        const holidayRequests = new Map();
        const holidayErrors = new Set();
        let calendarMonth = null;
        function getHoliday(dateKey) { return holidayCache.get(Number(dateKey.slice(0, 4)))?.[dateKey] || ''; }
        async function loadHolidays(year) {
            if (holidayCache.has(year)) return;
            if (holidayRequests.has(year)) return holidayRequests.get(year);
            const request = (async () => {
                const cacheKey = `mjin-holidays-KR-${year}`;
                try {
                    const stored = JSON.parse(localStorage.getItem(cacheKey) || 'null');
                    if (stored && stored.savedAt && Date.now() - stored.savedAt < 7 * 86400000 && stored.days) {
                        holidayCache.set(year, stored.days);
                        renderHolidayViews();
                        return;
                    }
                } catch (_) { /* 저장소 사용이 제한된 경우 온라인으로 조회 */ }
                try {
                    const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
                    if (!response.ok) throw new Error('공휴일 조회 실패');
                    const entries = await response.json();
                    const days = {};
                    for (const entry of entries) {
                        if (entry.global !== false && entry.types?.includes('Public')) {
                            days[entry.date] = entry.localName || entry.name;
                        }
                    }
                    holidayCache.set(year, days);
                    holidayErrors.delete(year);
                    try { localStorage.setItem(cacheKey, JSON.stringify({ savedAt: Date.now(), days })); } catch (_) { /* 저장소가 가득 차도 표시 */ }
                } catch (_) {
                    // 이전에 저장된 데이터가 있다면 연결 오류에도 활용합니다.
                    try { holidayCache.set(year, JSON.parse(localStorage.getItem(cacheKey) || 'null')?.days || {}); }
                    catch (_) { holidayCache.set(year, {}); }
                    holidayErrors.add(year);
                }
                renderHolidayViews();
            })();
            holidayRequests.set(year, request);
            try { await request; } finally { holidayRequests.delete(year); }
        }
        function renderHolidayViews() {
            if (isInitialized) { renderDayStrip(); renderSelectedHoliday(); }
            if (calendarMonth && document.getElementById('calendar-modal').style.display === 'flex') renderCalendar();
        }
        function renderSelectedHoliday() {
            const label = document.getElementById('selected-holiday');
            const name = getHoliday(selectedDate);
            label.hidden = !name;
            label.textContent = name ? `🇰🇷 ${name} · 공휴일` : '';
        }
        function openCalendar() {
            calendarMonth = new Date(parseLocalDate(selectedDate).getFullYear(), parseLocalDate(selectedDate).getMonth(), 1);
            document.getElementById('calendar-modal').style.display = 'flex';
            renderCalendar();
        }
        function closeCalendar() { document.getElementById('calendar-modal').style.display = 'none'; }
        function changeCalendarMonth(delta) {
            calendarMonth.setMonth(calendarMonth.getMonth() + delta);
            renderCalendar();
        }
        function chooseCalendarDate(dateKey) { selectedDate = dateKey; closeCalendar(); render(); }
        function renderCalendar() {
            const year = calendarMonth.getFullYear(), month = calendarMonth.getMonth();
            document.getElementById('calendar-title').textContent = `${year}년 ${month + 1}월`;
            const grid = document.getElementById('calendar-grid');
            grid.replaceChildren();
            const firstWeekday = new Date(year, month, 1).getDay();
            for (let i = 0; i < firstWeekday; i++) grid.appendChild(document.createElement('span'));
            const days = new Date(year, month + 1, 0).getDate();
            for (let day = 1; day <= days; day++) {
                const key = toDateKey(new Date(year, month, day));
                const holiday = getHoliday(key);
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `calendar-day${holiday ? ' holiday' : ''}${key === selectedDate ? ' selected' : ''}${(firstWeekday + day - 1) % 7 === 0 ? ' sunday' : ''}`;
                button.setAttribute('aria-label', `${key}${holiday ? ` ${holiday} 공휴일` : ''}`);
                const number = document.createElement('strong'); number.textContent = day;
                const name = document.createElement('small'); name.textContent = holiday;
                button.append(number, name);
                button.onclick = () => chooseCalendarDate(key);
                grid.appendChild(button);
            }
            document.getElementById('holiday-status').textContent = holidayErrors.has(year) ? '공휴일을 불러오지 못했습니다. 연결 후 다시 열어주세요.' : holidayCache.has(year) ? '' : '공휴일을 불러오는 중...';
            loadHolidays(year);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCRUUURJjH1r5YPe4lZdmZgWDehALSn43I",
            authDomain: "mjin-today.firebaseapp.com",
            databaseURL: "https://mjin-today-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mjin-today",
            storageBucket: "mjin-today.firebasestorage.app",
            messagingSenderId: "739442717844",
            appId: "1:739442717844:web:86c5339f16f4e198d43081"
        };
        const SYNC_PATH = "mjin_daily_data";

        const LOCAL_KEY = 'mjin_daily_data_local_v1';
        const PENDING_KEY = 'mjin_daily_data_pending_v1';
        let dbRef = null;
        let db = {}, fixedAcc = [], fixedTodo = [], memos = [];
        let realToday = toDateKey(new Date());
        let selectedDate = realToday;
        let isInitialized = true;
        let receivedRemote = false;
        let pending = {};
        let flushing = false;

        function setSyncStatus(message) { document.getElementById('sync-status').textContent = message; }
        function storeLocal() {
            try {
                localStorage.setItem(LOCAL_KEY, JSON.stringify({ db, fixedAcc, fixedTodo, memos }));
                localStorage.setItem(PENDING_KEY, JSON.stringify(pending));
            } catch (_) { setSyncStatus('⚠️ 저장 공간 확인 필요'); }
        }
        function loadLocal() {
            try {
                const data = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
                if (data) {
                    db = data.db || {};
                    fixedAcc = Array.isArray(data.fixedAcc) ? data.fixedAcc : [];
                    fixedTodo = Array.isArray(data.fixedTodo) ? data.fixedTodo : [];
                    memos = Array.isArray(data.memos) ? data.memos : [];
                }
                pending = JSON.parse(localStorage.getItem(PENDING_KEY) || '{}') || {};
            } catch (_) { pending = {}; }
            document.getElementById('loading-overlay').style.display = 'none';
            setSyncStatus('💾 이 브라우저에 저장');
            render();
        }
        async function flushPending() {
            if (!dbRef || flushing || !receivedRemote) return;
            flushing = true;
            try {
                while (Object.keys(pending).length) {
                    const [path, payload] = Object.entries(pending)[0];
                    await (path === 'all' ? dbRef : dbRef.child(path)).set(payload);
                    // 저장 중 같은 항목이 다시 바뀌었으면 새 값도 전송합니다.
                    if (pending[path] === payload) delete pending[path];
                    storeLocal();
                }
                setSyncStatus('✅ 동기화됨');
            } catch (error) {
                console.error('데이터 동기화 실패:', error);
                setSyncStatus('💾 기기에 저장됨 · 동기화 대기');
            } finally { flushing = false; }
        }
        function connectFirebase() {
            if (!window.firebase) {
                setSyncStatus('💾 기기에 저장됨 · 연결 대기');
                return;
            }
            try {
                firebase.initializeApp(firebaseConfig);
                dbRef = firebase.database().ref(SYNC_PATH);
                dbRef.on('value', (snapshot) => {
                    receivedRemote = true;
                    if (Object.keys(pending).length) { flushPending(); return; }
                    const data = snapshot.val();
                    db = data?.db || {};
                    fixedAcc = Array.isArray(data?.fixedAcc) ? data.fixedAcc : [];
                    fixedTodo = Array.isArray(data?.fixedTodo) ? data.fixedTodo : [];
                    memos = Array.isArray(data?.memos) ? data.memos : [];
                    storeLocal();
                    setSyncStatus('✅ 동기화됨');
                    render();
                }, (error) => {
                    console.error('Firebase 연결 실패:', error);
                    setSyncStatus('💾 기기에 저장됨 · 연결 오류');
                });
            } catch (error) {
                console.error('Firebase 초기화 실패:', error);
                setSyncStatus('💾 기기에 저장됨 · 연결 오류');
            }
        }

        function ensureDay(dateStr) {
            if (!db[dateStr]) {
                db[dateStr] = { acc: [], todo: [], done: [], msg: "", accOverrides: {}, todoOverrides: {} };
            } else {
                if (!db[dateStr].acc) db[dateStr].acc = [];
                if (!db[dateStr].todo) db[dateStr].todo = [];
                if (!db[dateStr].done) db[dateStr].done = [];
                if (!db[dateStr].accOverrides) db[dateStr].accOverrides = {};
                if (!db[dateStr].todoOverrides) db[dateStr].todoOverrides = {};
            }
            return db[dateStr];
        }

        function save(scope) {
            if (!isInitialized) return;
            let path, payload;
            if (scope === 'day') { path = 'db/' + selectedDate; payload = structuredClone(db[selectedDate]); }
            else if (scope === 'fixedAcc') { path = 'fixedAcc'; payload = structuredClone(fixedAcc); }
            else if (scope === 'fixedTodo') { path = 'fixedTodo'; payload = structuredClone(fixedTodo); }
            else if (scope === 'memos') { path = 'memos'; payload = structuredClone(memos); }
            else { path = 'all'; payload = structuredClone({ db, fixedAcc, fixedTodo, memos }); pending = {}; }
            pending[path] = payload;
            storeLocal();
            setSyncStatus(dbRef ? '💾 저장됨 · 동기화 중' : '💾 기기에 저장됨 · 연결 대기');
            flushPending();
        }

        // --- 메모 기능 ---
        function addMemo() {
            const input = document.getElementById('memo-input');
            const text = input.value.trim();
            if (!text) return;
            const newMemo = {
                id: Date.now(),
                text: text,
                date: new Date().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };
            memos.unshift(newMemo);
            save('memos');
            input.value = '';
            render();
        }

        function removeMemo(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            memos = memos.filter(m => m.id !== id);
            save('memos');
            render();
        }

        // [추가] 메모 수정 함수
        function editMemo(id) {
            const memoIndex = memos.findIndex(m => m.id === id);
            if (memoIndex === -1) return;

            const newText = prompt("메모를 수정하세요:", memos[memoIndex].text);
            if (newText !== null && newText.trim() !== "") {
                memos[memoIndex].text = newText.trim();
                // 수정 시 날짜 뒤에 (수정됨) 표시
                const now = new Date().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                memos[memoIndex].date = now + " (수정됨)";
                save('memos');
                render();
            }
        }

        function render() {
            if (!isInitialized) return;
            ensureDay(selectedDate);

            document.getElementById('current-focus-date').innerText = selectedDate.replace(/-/g, '.');
            document.getElementById('daily-msg-text').innerText = getEffectiveMsg(selectedDate);
            renderDayStrip();
            renderSelectedHoliday();

            const dayOfWeek = parseLocalDate(selectedDate).getDay();
            const isWeekday = dayOfWeek >= 1 && dayOfWeek <= 5;

            // 1. 가계부
            const accList = document.getElementById('acc-list'); accList.innerHTML = '';
            let dayTotal = 0;
            const accOverrides = db[selectedDate].accOverrides || {};
            const activeFixedAcc = fixedAcc.filter(i => i.fixedPeriod === 'weekday' ? isWeekday : true)
                .map(i => accOverrides[i.id] ? { ...i, ...accOverrides[i.id], isOverridden: true } : i);
            const sortedAcc = [...activeFixedAcc, ...db[selectedDate].acc].sort((a, b) => b.id - a.id);
            sortedAcc.forEach(i => {
                dayTotal += i.amount;
                accList.innerHTML += `<li class="list-item"><div class="item-info"><small>${i.category} ${i.isFixed ? '(고정)' : ''}${i.isOverridden ? ' <span class="ov-badge">✎수정됨</span>' : ''}</small><div class="name">${i.desc}</div></div><div class="amount-area"><span>${i.amount.toLocaleString()}원</span><button class="btn-icon-del" onclick="removeAcc(${i.isFixed}, ${i.id})">🗑️</button></div></li>`;
            });
            document.getElementById('day-expense').innerText = dayTotal.toLocaleString() + "원";

            // 2. 할 일
            const todoList = document.getElementById('todo-list'); todoList.innerHTML = '';
            const todoOverrides = db[selectedDate].todoOverrides || {};
            const activeFixedTodo = fixedTodo.filter(i => i.fixedPeriod === 'weekday' ? isWeekday : true)
                .map(i => todoOverrides[i.id] ? { ...i, ...todoOverrides[i.id], isOverridden: true } : i);
            const sortedTodo = [...activeFixedTodo, ...db[selectedDate].todo].sort((a, b) => b.time.localeCompare(a.time) || b.id - a.id);
            let pendingCount = 0;
            sortedTodo.forEach(t => {
                const isDone = (db[selectedDate].done || []).includes(String(t.id));
                if (!isDone) pendingCount++;
                todoList.innerHTML += `<li class="list-item ${isDone ? 'done' : ''}"><div class="todo-item" onclick="toggleTodo('${t.id}')"><div class="t-icon"></div><div class="item-info"><small>${t.time} ${t.isFixed ? '(반복)' : ''}</small><div class="name">${t.text}</div></div></div><button class="btn-icon-del" onclick="removeTodo(${t.isFixed}, ${t.id})">🗑️</button></li>`;
            });
            document.getElementById('day-todo-count').innerText = pendingCount + "개";

            // 3. 메모 렌더링 (수정 버튼 및 이벤트 추가)
            const memoList = document.getElementById('memo-list'); memoList.innerHTML = '';
            memos.forEach(m => {
                memoList.innerHTML += `
                    <li class="list-item memo-item">
                        <div class="memo-header">
                            <div class="memo-text" onclick="editMemo(${m.id})">${m.text}</div>
                            <div class="memo-btns">
                                <button class="btn-icon-edit" onclick="editMemo(${m.id})">✏️</button>
                                <button class="btn-icon-del" onclick="removeMemo(${m.id})">🗑️</button>
                            </div>
                        </div>
                        <div class="memo-date">${m.date}</div>
                    </li>`;
            });
        }

        function getEffectiveMsg(dateStr) {
            if (db[dateStr] && db[dateStr].msg) return db[dateStr].msg;
            const pastDates = Object.keys(db).filter(d => d < dateStr && db[d].msg).sort().reverse();
            return pastDates.length > 0 ? db[pastDates[0]].msg : "오늘의 한마디를 입력해보세요.";
        }

        function renderDayStrip() {
            const strip = document.getElementById('day-strip'); strip.innerHTML = '';
            let d = parseLocalDate(selectedDate); d.setDate(d.getDate() - d.getDay());
            for (let i = 0; i < 7; i++) {
                const dK = toDateKey(d);
                const item = document.createElement('div');
                const holiday = getHoliday(dK);
                item.className = `strip-item ${dK === selectedDate ? 'active' : ''} ${holiday ? 'holiday' : ''} ${d.getDay() === 0 ? 'sunday' : ''}`;
                item.title = holiday || '';
                item.setAttribute('aria-label', `${dK}${holiday ? ` ${holiday} 공휴일` : ''}`);
                item.innerHTML = `<span>${['일', '월', '화', '수', '목', '금', '토'][d.getDay()]}</span><strong>${d.getDate()}</strong>${holiday ? '<i class="holiday-dot" aria-hidden="true"></i>' : ''}`;
                item.onclick = () => { selectedDate = dK; render(); };
                strip.appendChild(item);
                d.setDate(d.getDate() + 1);
            }
            loadHolidays(parseLocalDate(selectedDate).getFullYear());
            loadHolidays(parseLocalDate(selectedDate).getFullYear() + (parseLocalDate(selectedDate).getMonth() === 11 ? 1 : 0));
            if (parseLocalDate(selectedDate).getMonth() === 0) loadHolidays(parseLocalDate(selectedDate).getFullYear() - 1);
        }

        function setToday() { realToday = toDateKey(new Date()); selectedDate = realToday; render(); }
        function moveDay(v) { let d = parseLocalDate(selectedDate); d.setDate(d.getDate() + v); selectedDate = toDateKey(d); render(); }
        function editDailyMsg() { ensureDay(selectedDate); const n = prompt(`한마디 수정`, getEffectiveMsg(selectedDate)); if (n !== null) { db[selectedDate].msg = n; save('day'); render(); } }
        function toggleTodo(id) {
            ensureDay(selectedDate);
            if (!db[selectedDate].done) db[selectedDate].done = [];
            const idx = db[selectedDate].done.indexOf(String(id));
            if (idx > -1) db[selectedDate].done.splice(idx, 1); else db[selectedDate].done.push(String(id));
            save('day'); render();
        }
        function addDailyEntry() {
            ensureDay(selectedDate);
            const d = document.getElementById('acc-desc'), a = document.getElementById('acc-amount'), c = document.getElementById('acc-cat'), f = document.getElementById('acc-fixed'), p = document.getElementById('acc-fixed-period');
            if (!d.value || !a.value) return;
            const newItem = { id: Date.now(), category: c.value, desc: d.value, amount: parseInt(a.value), isFixed: f.checked, fixedPeriod: p.value };
            if (f.checked) fixedAcc.push(newItem); else db[selectedDate].acc.push(newItem);
            save(f.checked ? 'fixedAcc' : 'day'); render(); d.value = ''; a.value = ''; f.checked = false;
        }
        function addDailyTodo() {
            ensureDay(selectedDate);
            const i = document.getElementById('todo-input'), t = document.getElementById('todo-time'), r = document.getElementById('todo-repeat'), p = document.getElementById('todo-repeat-period');
            if (!i.value) return;
            const newItem = { id: Date.now(), time: t.value, text: i.value, isFixed: r.checked, fixedPeriod: p.value };
            if (r.checked) fixedTodo.push(newItem); else db[selectedDate].todo.push(newItem);
            save(r.checked ? 'fixedTodo' : 'day'); render(); i.value = ''; r.checked = false;
        }
        function removeAcc(f, id) { ensureDay(selectedDate); if (f) fixedAcc = fixedAcc.filter(x => x.id !== id); else db[selectedDate].acc = db[selectedDate].acc.filter(x => x.id !== id); save(f ? 'fixedAcc' : 'day'); render(); }
        function removeTodo(f, id) { ensureDay(selectedDate); if (f) fixedTodo = fixedTodo.filter(x => x.id !== id); else db[selectedDate].todo = db[selectedDate].todo.filter(x => x.id !== id); save(f ? 'fixedTodo' : 'day'); render(); }
        function switchTab(t) { document.querySelectorAll('.m-tab').forEach(b => b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); event.currentTarget.classList.add('active'); document.getElementById('section-' + t).classList.add('active'); }
        function closeModal() { document.getElementById('report-modal').style.display = 'none'; }
        function resetAllData() { if (confirm('정말로 모든 데이터를 삭제하시겠습니까?')) { db = {}; fixedAcc = []; fixedTodo = []; memos = []; save(); render(); } }

        function getDayFixedTotal(dateStr) {
            const d = parseLocalDate(dateStr); const isWeekday = d.getDay() >= 1 && d.getDay() <= 5;
            const ov = (db[dateStr] && db[dateStr].accOverrides) || {};
            return fixedAcc.filter(i => i.fixedPeriod === 'weekday' ? isWeekday : true).reduce((s, i) => s + (ov[i.id] ? ov[i.id].amount : i.amount), 0);
        }
        function getMonthlyTotal(monthStr) {
            const [y, m] = monthStr.split('-').map(Number); const lastDay = new Date(y, m, 0).getDate(); let t = 0;
            for (let i = 1; i <= lastDay; i++) {
                const dK = `${y}-${String(m).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                t += getDayFixedTotal(dK); if (db[dK]) t += (db[dK].acc || []).reduce((a, b) => a + b.amount, 0);
            }
            return t;
        }
        function showReport() {
            const weeklyBody = document.getElementById('report-weekly-body'), monthlyBody = document.getElementById('report-monthly-body'), compBody = document.getElementById('report-compare-body');
            const thisM = realToday.substring(0, 7);
            const lastM = (() => { const [y, m] = thisM.split('-').map(Number); const d = new Date(y, m - 2, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; })();
            const thisT = getMonthlyTotal(thisM), lastT = getMonthlyTotal(lastM);
            compBody.innerHTML = `<div style="flex:1;text-align:center;padding:10px;background:rgba(0,0,0,0.03);border-radius:10px;"><div class="month-info-sub">${thisM}</div><div class="month-main-val">${thisT.toLocaleString()}원</div></div><div style="flex:1;text-align:center;padding:10px;background:rgba(0,0,0,0.03);border-radius:10px;"><div class="month-info-sub">${lastM}</div><div class="month-main-val">${lastT.toLocaleString()}원</div></div>`;
            const diff = thisT - lastT; document.getElementById('report-compare-diff').innerText = diff === 0 ? '지난달과 같아요' : (diff > 0 ? `지난달보다 ${diff.toLocaleString()}원 더 썼어요` : `지난달보다 ${Math.abs(diff).toLocaleString()}원 덜 썼어요`);
            weeklyBody.innerHTML = ''; for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); const dK = toDateKey(d); let val = getDayFixedTotal(dK); if (db[dK]) val += (db[dK].acc || []).reduce((a, b) => a + b.amount, 0); weeklyBody.innerHTML += `<div class="report-row"><span>${dK.substring(5)}</span><strong>${val.toLocaleString()}원</strong></div>`; }
            const months = [...new Set([...Object.keys(db).map(k => k.substring(0, 7)), thisM])].sort().reverse();
            monthlyBody.innerHTML = ''; months.forEach(m => { const t = getMonthlyTotal(m); monthlyBody.innerHTML += `<div class="report-row_ ${m === thisM ? 'current-month' : ''}"><span>${m}${m === thisM ? ' (이번달)' : ''}</span><strong>${t.toLocaleString()}원</strong></div>`; });
            document.getElementById('report-modal').style.display = 'flex';
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            document.getElementById('theme-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        });

        loadLocal();
        connectFirebase();
        window.addEventListener('online', () => {
            if (!dbRef) connectFirebase();
            else flushPending();
        });

        setInterval(() => {
            const now = toDateKey(new Date());
            if (now !== realToday) {
                realToday = now;
                if (selectedDate === realToday) render();
            }
        }, 60000);
    </script>
</body>

</html>
