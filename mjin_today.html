<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kakao Daily Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        <header class="app-header">
            <div class="header-left"><h1 class="logo">My Daily</h1></div>
            <div class="header-right">
                <button onclick="showReport()" class="btn-report">📊 리포트</button>
                <button id="theme-toggle" class="btn-theme">🌙</button>
            </div>
        </header>

        <!-- 주간 달력 스트립 -->
        <div id="day-strip" class="day-strip"></div>

        <!-- 네비게이션 (날짜 & 오늘 버튼) -->
        <nav class="week-nav">
            <button onclick="moveDay(-1)" class="nav-arrow">〈</button>
            <div class="nav-center">
                <span id="current-focus-date" class="view-date-text"></span>
                <button onclick="setToday()" class="btn-today-mini">오늘</button>
            </div>
            <button onclick="moveDay(1)" class="nav-arrow">〉</button>
        </nav>

        <!-- 오늘의 한마디 -->
        <section class="daily-msg-section" onclick="editDailyMsg()">
            <div class="msg-box"><span class="msg-icon">💬</span><p id="daily-msg-text">가져오는 중...</p></div>
        </section>

        <!-- 일일 요약 -->
        <section class="day-summary">
            <div class="sum-box"><span class="label">이 날의 지출</span><span class="val" id="day-expense">0</span></div>
            <div class="sum-box"><span class="label">남은 할일</span><span class="val" id="day-todo-count">0</span></div>
        </section>

        <!-- 탭 메뉴 -->
        <div class="main-tabs">
            <button class="m-tab active" onclick="switchTab('acc')">💰 가계부</button>
            <button class="m-tab" onclick="switchTab('todo')">✅ 할 일</button>
        </div>

        <main class="content">
            <!-- 가계부 입력 -->
            <div id="section-acc" class="tab-content active">
                <div class="input-form">
                    <div class="row">
                        <select id="acc-cat" class="kakao-input cat-select" style="flex:0.4"><option value="식비">🍔 식비</option><option value="교통비">🚌 교통비</option><option value="문화비">🎬 문화비</option><option value="쇼핑">🛍️ 쇼핑</option><option value="기타">✨ 기타</option></select>
                        <input type="number" id="acc-amount" class="kakao-input" placeholder="금액" style="flex:0.6">
                    </div>
                    <div class="row"><input type="text" id="acc-desc" class="kakao-input" placeholder="내역을 입력하세요" style="flex:1"></div>
                    <div class="row-sub"><label class="check-label"><input type="checkbox" id="acc-fixed"> 모든 날짜 고정지출</label><button onclick="addDailyEntry()" class="btn-add">등록</button></div>
                </div>
                <ul id="acc-list" class="kakao-list"></ul>
            </div>

            <!-- 할 일 입력 -->
            <div id="section-todo" class="tab-content">
                <div class="input-form">
                    <div class="row">
                        <input type="time" id="todo-time" class="kakao-input" style="flex:0.3" value="09:00">
                        <input type="text" id="todo-input" class="kakao-input" placeholder="오늘 할 일 입력" style="flex:0.7">
                    </div>
                    <div class="row-sub"><label class="check-label"><input type="checkbox" id="todo-repeat"> 모든 날짜 반복일정</label><button onclick="addDailyTodo()" class="btn-add">등록</button></div>
                </div>
                <ul id="todo-list" class="kakao-list"></ul>
            </div>
        </main>
    </div>

    <!-- 리포트 모달 -->
    <div id="report-modal" class="modal"><div class="modal-content"><h3>소비 리포트</h3><div id="report-weekly-body"></div><div class="report-month-box" id="report-monthly-body"></div><button onclick="closeModal()" class="btn-close">닫기</button></div></div>

    <script>
        let db = JSON.parse(localStorage.getItem('kakao_db_v9')) || {};
        let fixedAcc = JSON.parse(localStorage.getItem('kakao_fix_acc')) || [];
        let fixedTodo = JSON.parse(localStorage.getItem('kakao_fix_todo')) || [];
        let selectedDate = new Date().toISOString().split('T')[0];

        window.onload = () => { render(); };

        function save() {
            localStorage.setItem('kakao_db_v9', JSON.stringify(db));
            localStorage.setItem('kakao_fix_acc', JSON.stringify(fixedAcc));
            localStorage.setItem('kakao_fix_todo', JSON.stringify(fixedTodo));
        }

        // '오늘의 한마디' 상속 로직
        function getEffectiveMsg(dateStr) {
            if (db[dateStr] && db[dateStr].msg) return db[dateStr].msg;
            const pastDates = Object.keys(db).filter(d => d < dateStr && db[d].msg).sort().reverse();
            return pastDates.length > 0 ? db[pastDates[0]].msg : "오늘의 한마디를 입력해보세요.";
        }

        function render() {
            if(!db[selectedDate]) db[selectedDate] = { acc: [], todo: [], done: [], msg: "" };
            document.getElementById('current-focus-date').innerText = selectedDate.replace(/-/g,'.');
            document.getElementById('daily-msg-text').innerText = getEffectiveMsg(selectedDate);
            renderDayStrip();
            
            // 가계부 렌더링 (최근 등록순)
            const accList = document.getElementById('acc-list'); accList.innerHTML = '';
            let dayTotal = 0;
            const sortedAcc = [...fixedAcc, ...db[selectedDate].acc].sort((a,b) => b.id - a.id);
            sortedAcc.forEach((i) => {
                dayTotal += i.amount;
                const li = document.createElement('li'); li.className = 'list-item';
                li.innerHTML = `<div class="item-info"><small>${i.category} ${i.isFixed?'(고정)':''}</small><div class="name">${i.desc}</div></div><div class="amount-area"><span>${i.amount.toLocaleString()}원</span><button class="btn-icon-del" onclick="removeAcc(${i.isFixed}, ${i.id})">🗑️</button></div>`;
                accList.appendChild(li);
            });
            document.getElementById('day-expense').innerText = dayTotal.toLocaleString() + "원";

            // 할 일 렌더링 (최근 등록순)
            const todoList = document.getElementById('todo-list'); todoList.innerHTML = '';
            const sortedTodo = [...fixedTodo, ...db[selectedDate].todo].sort((a,b) => b.id - a.id);
            let pendingCount = 0;
            sortedTodo.forEach((t) => {
                const isDone = db[selectedDate].done.includes(String(t.id));
                if(!isDone) pendingCount++;
                const li = document.createElement('li'); li.className = `list-item ${isDone ? 'done' : ''}`;
                li.innerHTML = `<div class="todo-item" onclick="toggleTodo('${t.id}')"><div class="t-icon"></div><div class="item-info"><small>${t.time} ${t.isFixed?'(반복)':''}</small><div class="name">${t.text}</div></div></div><button class="btn-icon-del" onclick="removeTodo(${t.isFixed}, ${t.id})">🗑️</button>`;
                todoList.appendChild(li);
            });
            document.getElementById('day-todo-count').innerText = pendingCount + "개";
        }

        // 주간 달력 렌더링 로직 (현재 시점 기준 일~토)
        function renderDayStrip() {
            const strip = document.getElementById('day-strip'); strip.innerHTML = '';
            let d = new Date(selectedDate);
            d.setDate(d.getDate() - d.getDay()); // 해당 주의 일요일로 이동
            for(let i=0; i<7; i++) {
                const dStr = d.toISOString().split('T')[0];
                const item = document.createElement('div');
                item.className = `strip-item ${dStr === selectedDate ? 'active' : ''}`;
                item.innerHTML = `<span>${['일','월','화','수','목','금','토'][d.getDay()]}</span><strong>${d.getDate()}</strong>`;
                item.onclick = () => { selectedDate = dStr; render(); };
                strip.appendChild(item);
                d.setDate(d.getDate() + 1);
            }
        }

        function editDailyMsg() {
            const current = getEffectiveMsg(selectedDate);
            const n = prompt(`${selectedDate}의 한마디 수정`, current);
            if(n !== null) { db[selectedDate].msg = n; save(); render(); }
        }

        function toggleTodo(todoId) {
            const doneArr = db[selectedDate].done;
            const idx = doneArr.indexOf(String(todoId));
            if(idx > -1) doneArr.splice(idx, 1); else doneArr.push(String(todoId));
            save(); render();
        }

        function addDailyEntry() {
            const desc = document.getElementById('acc-desc'), amt = document.getElementById('acc-amount'), cat = document.getElementById('acc-cat'), fix = document.getElementById('acc-fixed');
            if(!desc.value || !amt.value) return;
            const newItem = { id: Date.now(), category: cat.value, desc: desc.value, amount: parseInt(amt.value), isFixed: fix.checked };
            if(fix.checked) fixedAcc.push(newItem); else db[selectedDate].acc.push(newItem);
            save(); render(); desc.value=''; amt.value=''; fix.checked=false;
        }

        function addDailyTodo() {
            const input = document.getElementById('todo-input'), time = document.getElementById('todo-time'), rep = document.getElementById('todo-repeat');
            if(!input.value) return;
            const newItem = { id: Date.now(), time: time.value, text: input.value, isFixed: rep.checked };
            if(rep.checked) fixedTodo.push(newItem); else db[selectedDate].todo.push(newItem);
            save(); render(); input.value=''; rep.checked=false;
        }

        function removeAcc(f, id) { if(f) fixedAcc=fixedAcc.filter(x=>x.id!==id); else db[selectedDate].acc=db[selectedDate].acc.filter(x=>x.id!==id); save(); render(); }
        function removeTodo(f, id) { if(f) fixedTodo=fixedTodo.filter(x=>x.id!==id); else db[selectedDate].todo=db[selectedDate].todo.filter(x=>x.id!==id); save(); render(); }
        function moveDay(v) { let d=new Date(selectedDate); d.setDate(d.getDate()+v); selectedDate=d.toISOString().split('T')[0]; render(); }
        function setToday() { selectedDate=new Date().toISOString().split('T')[0]; render(); }
        function switchTab(t) { document.querySelectorAll('.m-tab').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active')); event.currentTarget.classList.add('active'); document.getElementById('section-'+t).classList.add('active'); }
        function closeModal() { document.getElementById('report-modal').style.display='none'; }
        
        function showReport() {
            const weeklyBody = document.getElementById('report-weekly-body'), monthlyBody = document.getElementById('report-monthly-body');
            weeklyBody.innerHTML = ''; let weekTotal = 0, tempDate = new Date();
            for(let i=0; i<7; i++) {
                let dStr = tempDate.toISOString().split('T')[0], dExp = fixedAcc.reduce((a,b)=>a+b.amount, 0);
                if(db[dStr]) dExp += db[dStr].acc.reduce((a,b)=>a+b.amount, 0);
                weekTotal += dExp; weeklyBody.innerHTML += `<div class="report-row"><span>${dStr.substring(5)}</span><strong>${dExp.toLocaleString()}원</strong></div>`;
                tempDate.setDate(tempDate.getDate() - 1);
            }
            const curM = new Date().toISOString().substring(0, 7); let monT = 0;
            Object.keys(db).forEach(k => { if(k.startsWith(curM)) monT += db[k].acc.reduce((s,i)=>s+i.amount, 0); });
            const fixT = fixedAcc.reduce((s,i)=>s+i.amount, 0);
            monthlyBody.innerHTML = `<div class="month-main-val">${(monT + fixT).toLocaleString()}원</div><div class="month-info-sub">이번 달 합계 (${curM})</div>`;
            document.getElementById('report-modal').style.display = 'flex';
        }
        document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('dark-mode'); document.getElementById('theme-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙'; });
    </script>
</body>
</html>
